[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sastlab"
version = "0.1.0"
description = "Metamorphic testing of Python static analyzers: behavior-preserving rewrites chosen by search strategies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
semgrep = ["semgrep>=1.100"]

[project.scripts]
sastlab = "sastlab.cli:main"

[tool.setuptools]
packages = ["sastlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
